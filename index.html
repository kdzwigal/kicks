    <script>
      // Browser extension & sandbox iframe compatibility shim:
      // Prevents "TypeError: Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var _origFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _origFetch;
            },
            set: function(val) {
              _origFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // ignore if environment prevents redefinition
        }
      })();
    </script>
